services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: certifylk
      POSTGRES_USER: certifylk
      POSTGRES_PASSWORD: certifylk
    ports:
      - "${CERTIFYLK_POSTGRES_PORT:-5432}:5432"
    volumes:
      - certifylk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certifylk -d certifylk"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  certifylk_postgres_data:
