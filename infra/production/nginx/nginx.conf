user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'request_id=$request_id request_time=$request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_timeout 30s;
    client_header_timeout 15s;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
