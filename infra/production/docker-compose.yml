name: certifylk-production

services:
  postgres:
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true

  upload-init:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/certifylk-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /app/data/uploads && chown -R 10001:10001 /app/data/uploads"]
    volumes:
      - uploads:/app/data/uploads
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    restart: "no"

  backend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/certifylk-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      APP_ENV: production
      APP_NAME: CertifyLK API
      API_V1_PREFIX: /api/v1
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      CORS_ORIGINS: https://${DOMAIN_NAME:?DOMAIN_NAME is required}
      UPLOAD_DIR: /app/data/uploads
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-8}
      MAX_PDF_MB: ${MAX_PDF_MB:-12}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ALLOW_AI_FALLBACK: ${ALLOW_AI_FALLBACK:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - uploads:/app/data/uploads
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      upload-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/certifylk-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=64m,uid=10001,gid=10001,mode=0755
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required}
      NGINX_ENVSUBST_FILTER: ^DOMAIN_NAME$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/certifylk.conf:/etc/nginx/templates/certifylk.conf.template:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
    networks:
      - edge
      - app
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=4m,mode=0755
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --no-check-certificate https://127.0.0.1/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  migrate:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/certifylk-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    profiles: ["operations"]

  seed:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/certifylk-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    command:
      - python
      - -c
      - |
        from app.db.session import SessionLocal
        from app.services.seed_service import seed_catalogue
        with SessionLocal() as db:
            print(seed_catalogue(db))
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    profiles: ["operations"]

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-certifylk-production-postgres-data}
  uploads:
    name: ${UPLOADS_VOLUME_NAME:-certifylk-production-uploads}

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
