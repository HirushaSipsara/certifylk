name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      owner: ${{ steps.release.outputs.owner }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set release coordinates
        id: release
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag='${{ github.event.workflow_run.head_sha }}'
          [[ "$tag" =~ ^[0-9a-f]{40}$ ]]
          echo "owner=$owner" >>"$GITHUB_OUTPUT"
          echo "image_tag=$tag" >>"$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ steps.release.outputs.owner }}/certifylk-backend:${{ steps.release.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.image_tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and publish frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ steps.release.outputs.owner }}/certifylk-frontend:${{ steps.release.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.image_tag }}
          build-args: NEXT_PUBLIC_API_BASE_URL=/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy tested release to EC2
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.PRODUCTION_DOMAIN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: |
          if [[ ! "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]; then
            echo "::error::AWS_REGION is invalid or contains whitespace."
            exit 1
          fi
          if [[ ! "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo "::error::AWS_ROLE_ARN is invalid or contains whitespace."
            exit 1
          fi
          if [[ ! "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "::error::EC2_INSTANCE_ID is invalid or contains whitespace."
            exit 1
          fi
          if [[ ! "$PRODUCTION_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::PRODUCTION_DOMAIN is invalid or contains whitespace."
            exit 1
          fi
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: certifylk-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
          REPOSITORY_PATH: /opt/certifylk/repository
        shell: bash
        run: |
          parameters="$(jq -cn \
            --arg repository "$REPOSITORY_PATH" \
            --arg image_tag "$IMAGE_TAG" \
            '{commands: [
              "set -Eeuo pipefail",
              ("test -d " + ($repository | @sh) + "/.git"),
              ("runuser -u certifylk -- env HOME=/opt/certifylk git -C " + ($repository | @sh) + " fetch --prune origin"),
              ("runuser -u certifylk -- env HOME=/opt/certifylk git -C " + ($repository | @sh) + " checkout --detach " + ($image_tag | @sh)),
              ("runuser -u certifylk -- env HOME=/opt/certifylk IMAGE_TAG=" + ($image_tag | @sh) + " bash " + ($repository | @sh) + "/infra/production/scripts/deploy.sh")
            ]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy CertifyLK $IMAGE_TAG" \
            --parameters "$parameters" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in {1..90}; do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 10
          done

          aws ssm cancel-command --command-id "$command_id" >/dev/null
          echo "Deployment command timed out." >&2
          exit 1
