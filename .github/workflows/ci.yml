name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: certifylk
          POSTGRES_USER: certifylk
          POSTGRES_PASSWORD: certifylk-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U certifylk -d certifylk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and audit tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e './backend[dev]'
          python -m pip install 'pip-audit>=2.9,<3' 'bandit>=1.8,<2'
      - name: Format and lint
        working-directory: backend
        run: |
          python -m ruff format --no-cache --check app tests
          python -m ruff check --no-cache app tests
      - name: Type check
        working-directory: backend
        run: python -m mypy app
      - name: Test
        working-directory: backend
        env:
          AI_PROVIDER: mock
          TEST_POSTGRES_URL: postgresql+psycopg://certifylk:certifylk-ci@127.0.0.1:5432/certifylk
        run: python -m pytest
      - name: Audit Python dependencies
        working-directory: backend
        run: |
          python -m pip_audit --local --skip-editable
          python -m bandit -q -r app -ll

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Component tests
        run: npm test -- --run
      - name: Production build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
        run: npm run build

  e2e:
    name: Mock-AI happy path
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: certifylk
          POSTGRES_USER: certifylk
          POSTGRES_PASSWORD: certifylk-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U certifylk -d certifylk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application dependencies
        run: |
          python -m pip install -e ./backend
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Migrate and seed PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://certifylk:certifylk-ci@127.0.0.1:5432/certifylk
          AI_PROVIDER: mock
        run: |
          cd backend
          python -m alembic upgrade head
          cd ..
          python scripts/seed_demo_data.py
      - name: Start backend
        env:
          DATABASE_URL: postgresql+psycopg://certifylk:certifylk-ci@127.0.0.1:5432/certifylk
          AI_PROVIDER: mock
          ALLOW_AI_FALLBACK: "true"
          UPLOAD_DIR: /tmp/certifylk-uploads
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/certifylk-backend.log 2>&1 &
          echo $! >/tmp/certifylk-backend.pid
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/api/v1/ready && exit 0
            sleep 2
          done
          cat /tmp/certifylk-backend.log
          exit 1
      - name: Run browser happy path
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npm run test:e2e
      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/certifylk-backend.log || true

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize providers without a backend
        run: terraform init -backend=false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate configuration
        run: terraform validate

  containers:
    name: Production container builds
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: false
          tags: certifylk-backend:ci-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: false
          tags: certifylk-frontend:ci-${{ github.sha }}
          build-args: NEXT_PUBLIC_API_BASE_URL=/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Validate production Compose interpolation
        run: docker compose --env-file infra/production/.env.production.example -f infra/production/docker-compose.yml --profile operations config --quiet
